spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowforge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:flowforge}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-milliseconds=${APP_JWT_EXPIRATION_MILLISECONDS:86400000}

